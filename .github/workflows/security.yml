name: Security

# Pull requests, main and a weekly run (new advisories appear without a code change). The required status check is the `security` job at the
# bottom. No secrets are used. security-events: write is granted only to the jobs that upload SARIF to code scanning.
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:

permissions: {}

concurrency:
  group: security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  GITLEAKS_VERSION: "8.30.1"
  GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
  OSV_SCANNER_VERSION: "2.7.1"
  OSV_SCANNER_SHA256: "fb7dab19a8bd9bbe5c3189f09d4b7ee1820c9553a23bac202648a56efd2f6ee8"
  ACTIONLINT_VERSION: "1.7.12"
  ACTIONLINT_SHA256: "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8"
  PIP_AUDIT_VERSION: "2.10.1"
  TRIVY_VERSION: "0.76.2"

jobs:
  secrets:
    name: secret scan (full history)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install gitleaks (checksum pinned)
        run: |
          curl -fsSL -o gitleaks.tgz "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tgz" | sha256sum -c -
          tar -xzf gitleaks.tgz gitleaks
          sudo install -m 0755 gitleaks /usr/local/bin/gitleaks
      - name: Every commit in the history (.gitleaks.toml allowlists exact test values only)
        run: gitleaks git --no-banner --redact --verbose
      - name: The working tree
        run: gitleaks dir --no-banner --redact --verbose .

  codeql:
    name: CodeQL (${{ matrix.language }})
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write   # upload SARIF to code scanning (this job only)
    strategy:
      fail-fast: false
      matrix:
        language: [python, javascript-typescript]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          languages: ${{ matrix.language }}
          queries: security-extended
          build-mode: none
      - uses: github/codeql-action/analyze@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          category: /language:${{ matrix.language }}

  dependencies:
    name: dependency audit (pip-audit, npm audit, osv-scanner)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: The audit gate's own tests
        run: uv run --no-project --with pytest python -m pytest scripts/tests -q -p no:cacheprovider
      - name: Python (pip-audit over the locked requirements; it reports no severity, so any advisory fails)
        run: |
          uv export --frozen --all-packages --no-emit-workspace --format requirements-txt -o requirements-audit.txt > /dev/null
          uvx --from "pip-audit==${PIP_AUDIT_VERSION}" pip-audit -r requirements-audit.txt --no-deps --disable-pip --progress-spinner off -f json -o pip-audit.json || true
          python3 scripts/audit_gate.py pip pip-audit.json
      - name: Web production dependencies (npm audit; high and critical fail)
        working-directory: apps/web
        run: |
          npm audit --omit=dev --audit-level=high || true
          npm audit --omit=dev --json > ../../npm-audit.json || true
          python3 ../../scripts/audit_gate.py npm ../../npm-audit.json
      - name: Both lockfiles (osv-scanner, checksum pinned; CVSS 7.0 and above fails)
        run: |
          curl -fsSL -o osv-scanner "https://github.com/google/osv-scanner/releases/download/v${OSV_SCANNER_VERSION}/osv-scanner_linux_amd64"
          echo "${OSV_SCANNER_SHA256}  osv-scanner" | sha256sum -c -
          chmod +x osv-scanner
          ./osv-scanner scan source -L uv.lock -L apps/web/package-lock.json --format json --output-file osv.json || true
          python3 scripts/audit_gate.py osv osv.json

  dockerfiles:
    name: hadolint and trivy config
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write   # upload SARIF to code scanning (this job only)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: hadolint/hadolint-action@06be81baf89a55ffd0e24b8f04a4185738dd3387 # v3.5.0
        with:
          dockerfile: infra/docker/Dockerfile.service
          failure-threshold: warning
      - uses: hadolint/hadolint-action@06be81baf89a55ffd0e24b8f04a4185738dd3387 # v3.5.0
        with:
          dockerfile: infra/docker/Dockerfile.worker
          failure-threshold: warning
      - uses: hadolint/hadolint-action@06be81baf89a55ffd0e24b8f04a4185738dd3387 # v3.5.0
        with:
          dockerfile: infra/docker/Dockerfile.proxy
          failure-threshold: warning
      - uses: hadolint/hadolint-action@06be81baf89a55ffd0e24b8f04a4185738dd3387 # v3.5.0
        with:
          dockerfile: infra/docker/Dockerfile.web
          failure-threshold: warning
      - uses: aquasecurity/setup-trivy@81e514348e19b6112ce2a7e3ecbafe19c1e1f567 # v0.3.1
        with:
          version: v${{ env.TRIVY_VERSION }}
      - name: trivy config over infra/ (Dockerfiles; trivy has no checks for compose files); SARIF for code scanning
        run: trivy config --severity HIGH,CRITICAL --format sarif --output trivy-config.sarif infra
      - name: The same scan as a gate
        run: trivy config --severity HIGH,CRITICAL --exit-code 1 infra
      - uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        if: always() && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.fork == false)
        with:
          sarif_file: trivy-config.sarif
          category: trivy-config

  images:
    name: trivy image scans (every memorylab-* image)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - uses: aquasecurity/setup-trivy@81e514348e19b6112ce2a7e3ecbafe19c1e1f567 # v0.3.1
        with:
          version: v${{ env.TRIVY_VERSION }}
      - name: Build every image
        run: infra/docker/build.sh --all
      - name: HIGH and CRITICAL with a fix available fail the job (OS packages and language packages)
        run: |
          status=0
          for image in $(docker image ls --filter label=memorylab.owner=memorylab --format '{{.Repository}}:{{.Tag}}'); do
            echo "::group::$image"
            trivy image --quiet --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 "$image" || status=1
            echo "::endgroup::"
          done
          exit $status

  workflows:
    name: actionlint and zizmor
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: actionlint (checksum pinned)
        run: |
          curl -fsSL -o actionlint.tgz "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          echo "${ACTIONLINT_SHA256}  actionlint.tgz" | sha256sum -c -
          tar -xzf actionlint.tgz actionlint
          ./actionlint -color
      - uses: zizmorcore/zizmor-action@45d7276c9ca790aabd705e31ca99c6185c3e76dd # v0.8.1
        with:
          advanced-security: false
          persona: pedantic

  security:
    name: security
    if: always()
    needs: [secrets, codeql, dependencies, dockerfiles, images, workflows]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Every security job must have succeeded (this is the required status check)
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "results: $RESULTS"
          for r in $RESULTS; do
            [ "$r" = "success" ] || { echo "a security job did not succeed: $r"; exit 1; }
          done
