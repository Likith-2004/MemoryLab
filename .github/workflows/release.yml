name: Release

# On a version tag: build every image, publish it to GHCR with an SPDX SBOM, a keyless cosign signature and a build provenance attestation.
# Nothing is deployed anywhere. A tag is accepted only if its commit is on main and passed the required CI `gate`.
on:
  push:
    tags: ["v*"]

permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io

jobs:
  verify:
    name: verify the tag
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      checks: read             # read the CI gate result of the tagged commit
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: The tagged commit is on main and CI passed on it
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          SHA: ${{ github.sha }}
          REPO: ${{ github.repository }}
        run: |
          git fetch --no-tags origin main
          git merge-base --is-ancestor "$SHA" origin/main || { echo "::error::$TAG is not on main"; exit 1; }
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]] || { echo "::error::$TAG is not a semantic version tag"; exit 1; }
          conclusion=$(gh api "repos/$REPO/commits/$SHA/check-runs?per_page=100" --jq '[.check_runs[] | select(.name == "gate")] | sort_by(.completed_at) | last | .conclusion')
          [ "$conclusion" = "success" ] || { echo "::error::the CI gate on $SHA is '$conclusion', not success"; exit 1; }

  publish:
    name: publish ${{ matrix.image }}
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write          # push the image to GHCR (this job only)
      id-token: write          # keyless signing and provenance: the run's OIDC identity
      attestations: write      # store the provenance attestation
    strategy:
      fail-fast: false
      matrix:
        image: [worker, egress, dockerproxy, ingest, api, accounts, orchestrator, reaper, web]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
      - name: Build the image
        env:
          IMAGE: ${{ matrix.image }}
        run: infra/docker/build.sh --only "$IMAGE"
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Tag and push
        id: push
        env:
          IMAGE: ${{ matrix.image }}
          TAG: ${{ github.ref_name }}
          OWNER: ${{ github.repository_owner }}
        run: |
          owner="${OWNER,,}"
          ref="$REGISTRY/$owner/memorylab-$IMAGE"
          docker tag "memorylab-$IMAGE:dev" "$ref:$TAG"
          docker push "$ref:$TAG"
          digest=$(docker inspect --format '{{index .RepoDigests 0}}' "$ref:$TAG" | cut -d@ -f2)
          echo "ref=$ref" >> "$GITHUB_OUTPUT"
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
      - name: SBOM (SPDX)
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          image: ${{ steps.push.outputs.ref }}@${{ steps.push.outputs.digest }}
          format: spdx-json
          output-file: sbom-${{ matrix.image }}.spdx.json
          upload-artifact: true
          upload-release-assets: false
      - name: Sign the image and attach the SBOM (keyless)
        env:
          REF: ${{ steps.push.outputs.ref }}
          DIGEST: ${{ steps.push.outputs.digest }}
          IMAGE: ${{ matrix.image }}
        run: |
          cosign sign --yes "$REF@$DIGEST"
          cosign attest --yes --type spdxjson --predicate "sbom-$IMAGE.spdx.json" "$REF@$DIGEST"
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ steps.push.outputs.ref }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
