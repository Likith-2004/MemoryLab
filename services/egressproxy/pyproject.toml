[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "egressproxy"
version = "0.1.0"
description = "Memory Lab egress allowlist proxy for run sandboxes (CONNECT + plain HTTP forwarding)"
requires-python = ">=3.14"
dependencies = []

[project.scripts]
egressproxy = "egressproxy.main:main"

[tool.hatch.build.targets.wheel]
packages = ["src/egressproxy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["RUF059", "RUF015"]

[tool.mypy]
strict = true
python_version = "3.14"
