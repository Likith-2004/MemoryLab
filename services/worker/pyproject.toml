[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "worker"
version = "0.1.0"
description = "Memory Lab run worker: runs one agent run inside a sandbox container"
requires-python = ">=3.14"
dependencies = ["labharness", "runlog", "httpx>=0.27"]

[project.scripts]
memorylab-worker = "worker.main:main"

[dependency-groups]
dev = ["ingest"]

[tool.uv.sources]
labharness = { workspace = true }
runlog = { workspace = true }
ingest = { workspace = true }

[tool.hatch.build.targets.wheel]
packages = ["src/worker"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
filterwarnings = ["error::pytest.PytestUnraisableExceptionWarning", "error::pytest.PytestUnhandledThreadExceptionWarning"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["RUF059", "RUF015"]

[tool.mypy]
strict = true
python_version = "3.14"
