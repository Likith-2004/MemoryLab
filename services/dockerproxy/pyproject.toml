[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "dockerproxy"
version = "0.1.0"
description = "Memory Lab Docker API filter: the orchestrator's only way to the Docker daemon, allowing nothing but our own hardened sandboxes"
requires-python = ">=3.14"
dependencies = []

[project.scripts]
dockerproxy = "dockerproxy.main:main"

[tool.hatch.build.targets.wheel]
packages = ["src/dockerproxy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = ["docker: needs a local Docker daemon and the memorylab-worker image"]
filterwarnings = ["error::pytest.PytestUnraisableExceptionWarning", "error::pytest.PytestUnhandledThreadExceptionWarning"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["RUF059", "RUF015"]

[tool.mypy]
strict = true
python_version = "3.14"
