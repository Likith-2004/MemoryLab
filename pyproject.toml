[tool.uv.workspace]
members = ["packages/labharness", "packages/runlog", "services/ingest", "services/egressproxy", "services/dockerproxy", "services/worker", "services/orchestrator", "services/api", "services/accounts", "packages/cli"]

[tool.ruff]
line-length = 100
