[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "memorylab-cli"
version = "0.1.0"
description = "Memory Lab command line client: a thin client of the public /api/v1 (no database, no service keys)"
requires-python = ">=3.14"
dependencies = ["httpx>=0.27", "websockets>=13", "rich>=13", "click>=8.1"]

[project.scripts]
memorylab = "memorylab_cli.main:main"

[tool.hatch.build.targets.wheel]
packages = ["src/memorylab_cli"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 120
src = ["src", "tests"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["RUF059", "RUF015"]

[tool.mypy]
strict = true
python_version = "3.14"
